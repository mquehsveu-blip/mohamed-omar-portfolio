function getPref(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function setPref(k,v){try{if(v===null)window.localStorage.removeItem(k);else window.localStorage.setItem(k,v)}catch(e){}}
function clone(x){return JSON.parse(JSON.stringify(x))}

var state={data:clone(SAVED),lang:getPref('pf-lang')==='en'?'en':'ar',showAll:false,paused:false,filter:'all',tab:'basics',open:{},canEdit:false,artifact:null,assets:null,readOnly:false,saving:false,urls:{},confirm:null,view:null,pendingDraft:null,
  form:{name:'',contact:'',type:'',time:'flex',budget:'',details:''},ticket:false,formError:false};

(function loadDraft(){
  var raw=getPref(DRAFT_KEY); if(!raw)return;
  try{var d=normalize(JSON.parse(raw)); if(JSON.stringify(d)!==SAVED_JSON)state.pendingDraft=d; else setPref(DRAFT_KEY,null)}catch(e){setPref(DRAFT_KEY,null)}
})();

function str(v){return typeof v==='string'?v:''}
function bi(v){v=v||{};return {ar:str(v.ar),en:str(v.en)}}
function list(v){return Array.isArray(v)?v.filter(function(x){return x&&typeof x==='object'}):[]}
function normalize(d){
  if(!d||typeof d!=='object'||!d.profile||!Array.isArray(d.projects))throw new Error('bad');
  var p=d.profile, used={};
  return {
    profile:{name:bi(p.name),role:bi(p.role),headline:bi(p.headline),intro:bi(p.intro),about:bi(p.about),location:bi(p.location),portrait:str(p.portrait),whatsapp:str(p.whatsapp),email:str(p.email)},
    stats:list(d.stats).map(function(s){return {value:str(s.value),label:bi(s.label)}}),
    services:list(d.services).map(function(s){return {title:bi(s.title),desc:bi(s.desc)}}),
    projects:list(d.projects).map(function(x){var id=/^p-[A-Za-z0-9-]+$/.test(x.id)&&!used[x.id]?x.id:newId();used[id]=1;return {id:id,title:bi(x.title),category:str(x.category)||'misc',year:str(x.year),client:bi(x.client),summary:bi(x.summary),challenge:bi(x.challenge),solution:bi(x.solution),color:color(x.color),palette:str(x.palette),cover:str(x.cover),gallery:Array.isArray(x.gallery)?x.gallery.filter(str):[],link:str(x.link),sample:!!x.sample}}),
    testimonials:list(d.testimonials).map(function(r){return {quote:bi(r.quote),name:str(r.name),role:str(r.role)}}),
    socials:list(d.socials).map(function(s){return {label:str(s.label),url:str(s.url)}})
  };
}
function newId(){return 'p-'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}

function t(k){return T[state.lang][k]||k}
function tx(o){if(!o)return '';return o[state.lang]||o[state.lang==='ar'?'en':'ar']||''}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rich(s){return esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>')}
function safeUrl(u){u=str(u).trim();return /^https:\/\//i.test(u)?u:''}
function color(c){return /^#[0-9a-f]{6}$/i.test(c)?c:'#8c0e26'}
function onColor(h){var n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (r*299+g*587+b*114)/1000>150?'#15161d':'#ffffff'}
function src(ref){ref=str(ref).trim();if(!ref)return '';if(state.urls[ref])return state.urls[ref];if(/^(?!\.\.?\/)(?!\/)(?!.*(?:^|\/)\.\.(?:\/|$))[A-Za-z0-9][A-Za-z0-9._/-]{0,180}$/.test(ref))return ref;return ''}
function waDigits(){return state.data.profile.whatsapp.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/\D/g,'').replace(/^00/,'').replace(/^(01[0125]\d{8})$/,'2$1')}
function catName(c){return T[state.lang][c]||T[state.lang].misc}
function ext(href,label,cls){return '<a class="'+(cls||'')+'" href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(label)+'</a>'}

/* Placeholder cover art, drawn from the project colour until a real image is uploaded. */
function art(p){
  var c=color(p.color),f=onColor(c),s='<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="'+esc(tx(p.title))+'"><rect width="400" height="300" fill="'+c+'"/>';
  function r(x,y,w,h,o,fill,extra){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||f)+'" fill-opacity="'+o+'" '+(extra||'')+'/>'}
  if(p.category==='packaging'){
    s+=r(78,92,78,148,.92,null,'rx="5"')+r(78,152,78,42,.55,c)+r(170,58,92,182,.72,null,'rx="30"')+'<circle cx="216" cy="146" r="28" fill="'+c+'"/>'+'<path d="M290 112h46l12 128h-70z" fill="'+f+'" fill-opacity=".5"/>'+r(296,170,34,7,1,c)+r(48,240,320,2,.45);
  }else if(p.category==='social'){
    for(var i=0;i<6;i++){var x=62+(i%3)*96,y=56+Math.floor(i/3)*96;s+=r(x,y,84,84,i%2?.18:.9,null,'rx="6"');
      if(i%2)s+='<circle cx="'+(x+42)+'" cy="'+(y+42)+'" r="'+(18+i*2)+'" fill="'+f+'" fill-opacity=".75"/>';else s+=r(x+14,y+52,56,7,1,c)+r(x+14,y+66,34,5,.6,c)}
  }else if(p.category==='print'){
    s+='<g transform="rotate(-8 150 155)">'+r(82,52,138,196,.45)+'</g><g transform="rotate(5 245 150)">'+r(180,46,144,204,.95)+'<circle cx="252" cy="122" r="46" fill="'+c+'"/>'+r(198,192,108,10,1,c)+r(198,212,72,6,.55,c)+'</g>';
  }else{
    s+='<path d="M110 70h90v90a90 90 0 0 1-90-90z" fill="'+f+'"/><circle cx="246" cy="115" r="45" fill="'+f+'" fill-opacity=".55"/><path d="M110 230a90 70 0 0 1 90-70v70z" fill="'+f+'" fill-opacity=".75"/>'+r(200,160,90,70,.3);
  }
  return s+'</svg>';
}
function cover(p){var u=src(p.cover);return u?'<img src="'+esc(u)+'" alt="'+esc(tx(p.title))+'">':art(p)}

function isDemo(){return state.data.projects.some(function(p){return p.sample})}
function showReviews(){return state.data.testimonials.length>0||state.canEdit}
function currentTheme(){return root.getAttribute('data-theme')==='light'?'light':'dark'}

function header(){
  var d=state.data,studioView=route().name==='studio',h='';
  if(isDemo())h+='<div class="notice"><div class="wrap"><span>'+esc(t('demo'))+'</span>'+(state.canEdit?'<a href="#studio">'+esc(t('demoEdit'))+'</a>':'')+'</div></div>';
  h+='<header class="top"><div class="wrap bar"><a class="brand" href="#top"><i></i><span>'+esc(tx(d.profile.name))+'</span></a>'+(studioView?'':'<nav class="links">'
   +'<a href="#work">'+esc(t('work'))+'</a><a href="#about">'+esc(t('about'))+'</a><a href="#services">'+esc(t('services'))+'</a>'
   +(showReviews()?'<a href="#reviews">'+esc(t('reviews'))+'</a>':'')+'<a href="#contact">'+esc(t('contact'))+'</a></nav>')+'<div class="tools">'
   +'<button type="button" class="btn small" data-action="lang">'+esc(t('other'))+'</button>'
   +'<button type="button" class="btn small" data-action="theme">'+esc(currentTheme()==='dark'?t('light'):t('dark'))+'</button>'
   +(state.canEdit?'<a class="btn small" href="#studio">'+esc(t('studio'))+'</a>':'')+'</div></div></header>';
  return h;
}
function waCta(label){var num=waDigits();return num?ext('https://wa.me/'+num,label+' ↗','btn primary'):'<a class="btn primary" href="#contact">'+esc(label)+'</a>'}
function socialLinks(){return state.data.socials.filter(function(s){return safeUrl(s.url)}).map(function(s){return ext(safeUrl(s.url),(s.label||s.url)+' ↗')})}
function firstName(){var w=tx(state.data.profile.name).trim().split(/\s+/);return /^(عبد|أبو|ابو)$/.test(w[0])&&w[1]?w[0]+' '+w[1]:w[0]}
function secHead(n,label,title){return '<div class="sec-head"><p class="eyebrow">'+(n<10?'0':'')+n+' / '+esc(label)+'</p><h2>'+rich(title)+'</h2></div>'}
function card(x,clone){return '<a class="card" href="#'+x.id+'"'+(clone?' data-clone aria-hidden="true" tabindex="-1"':'')+'><div class="cover">'+cover(x)+(x.sample?'<span class="tag">'+esc(t('sample'))+'</span>':'')+'</div><div class="card-meta"><h3>'+esc(tx(x.title))+'</h3><span class="muted">'+esc(catName(x.category))+(x.year?' · '+esc(x.year):'')+'</span></div></a>'}
function workStrip(){
  var all=state.data.projects;if(!all.length)return '<div class="wrap"><p class="muted">'+esc(t('noProjects'))+'</p></div>';
  var set=all.slice();while(set.length<6)set=set.concat(all);
  var cards=set.map(function(x,i){return card(x,i>=all.length)}).join('')+set.map(function(x){return card(x,true)}).join('');
  return '<div class="marquee'+(state.paused?' paused':'')+'"><div class="track" style="animation-duration:'+(set.length*9)+'s">'+cards+'</div></div>';
}
function workGrid(){
  var d=state.data,cats=[];d.projects.forEach(function(x){if(cats.indexOf(x.category)<0)cats.push(x.category)});
  if(state.filter!=='all'&&cats.indexOf(state.filter)<0)state.filter='all';
  var shown=d.projects.filter(function(x){return state.filter==='all'||x.category===state.filter});
  return (cats.length>1?'<div class="chips" style="margin-top:22px">'+['all'].concat(cats).map(function(c){return '<button type="button" class="chip" data-action="filter" data-v="'+esc(c)+'" aria-pressed="'+(state.filter===c)+'">'+esc(c==='all'?t('all'):catName(c))+'</button>'}).join('')+'</div>':'')
   +'<div class="grid">'+shown.map(function(x){return card(x,false)}).join('')+'</div>';
}

  if(showReviews()){

function spy(){
  var links=app.querySelectorAll('.rail a');if(!links.length)return;var cur=0;
  Array.prototype.forEach.call(links,function(a,i){var el=document.getElementById(a.getAttribute('href').slice(1));if(el&&el.getBoundingClientRect().top<window.innerHeight*.45)cur=i});
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur=links.length-1;
  Array.prototype.forEach.call(links,function(a,i){if(i===cur)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')});
}
var watcher;
function counters(){
  if(watcher)watcher.disconnect();
  if(!window.IntersectionObserver||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  watcher=new IntersectionObserver(function(entries){entries.forEach(function(en){
    if(!en.isIntersecting)return;watcher.unobserve(en.target);
    var el=en.target,final=el.textContent,m=final.match(/^(\+?)(\d{1,6})(\+?)$/),start=null;
    if(!m||!Number(m[2]))return;
    function step(ts){start=start||ts;var k=Math.min(1,(ts-start)/1100);el.textContent=k<1?m[1]+Math.round(m[2]*k)+m[3]:final;if(k<1)requestAnimationFrame(step)}
    requestAnimationFrame(step);
  })},{threshold:.6});
  Array.prototype.forEach.call(app.querySelectorAll('.stat strong'),function(el){watcher.observe(el)});
}
function after(){tick();spy();counters()}

/* The saved page is rebuilt from the original source plus the new content, never from the live DOM. */
function buildDocument(data){
  var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var json=JSON.stringify(data).replace(/</g,'\\u003c'),end='</scr'+'ipt>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +'<title>بورتفوليو المصمم</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">\n'
   +'<style id="app-style">'+SRC.style+'</style>\n<div id="app"></div>\n<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>\n'
   +'<script type="application/json" id="site-data">'+json+end+'\n<script id="app-script">'+SRC.script+end+'\n</body></html>';

function save(){
  if(!canSave()||state.saving||!isDirty())return;
  state.saving=true;setPref(DRAFT_KEY,JSON.stringify(state.data));render();
  state.artifact.publish(buildDocument(state.data)).then(function(){toast(t('saved'))},function(e){
    state.saving=false;var code=e&&e.code;
    if(code==='conflict')toast(t('conflict'));
    else if(code==='too_large')toast(t('tooBig'));
    else if(['not_writer','not_granted','not_declared','capability_disabled','capability_removed','consent_required'].indexOf(code)>=0){state.readOnly=true;toast(t('noSave'))}
    else toast(t('saveFail'));
    render();
  });
}

function shrink(file){
  return new Promise(function(ok,bad){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var scale=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
      var g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){
        if(b&&b.type==='image/webp')return ok(b);
        g.globalCompositeOperation='destination-over';g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);
        c.toBlob(function(j){j?ok(j):bad()},'image/jpeg',.86);
      },'image/webp',.86);
    };
    img.onerror=function(){URL.revokeObjectURL(url);bad()};
    img.src=url;
  });
}
function upload(input){
  var files=Array.prototype.slice.call(input.files||[]),multi=!!input.getAttribute('data-multi'),target=resolve(input.getAttribute('data-upload'));
  if(!files.length||!state.assets)return;
  input.disabled=true;toast(t('uploading'));
  files.reduce(function(chain,file){return chain.then(function(){return shrink(file).then(function(b){return state.assets.upload(b)}).then(function(res){
      state.urls[res.id]=res.url;
      if(multi)target.o[target.key].push(res.id);else target.o[target.key]=res.id;
      changed();
    })})},Promise.resolve())
    .then(function(){document.getElementById('toast').hidden=true;render()},function(){toast(t('uploadFail'));render()});
}

var BLANK={
  projects:function(){return {id:newId(),title:{ar:'',en:''},category:'identity',year:String(new Date().getFullYear()),client:{ar:'',en:''},summary:{ar:'',en:''},challenge:{ar:'',en:''},solution:{ar:'',en:''},color:'#8c0e26',palette:'',cover:'',gallery:[],link:'',sample:false}},
  services:function(){return {title:{ar:'',en:''},desc:{ar:'',en:''}}},
  testimonials:function(){return {quote:{ar:'',en:''},name:'',role:''}},
  socials:function(){return {label:'',url:''}}
};

app.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');if(!el)return;
  var a=el.getAttribute('data-action'),v=el.getAttribute('data-v'),ln=el.getAttribute('data-list'),i=Number(el.getAttribute('data-i'));
  if(a!=='del'&&a!=='discard')state.confirm=null;
  if(a==='lang'){state.lang=state.lang==='ar'?'en':'ar';setPref('pf-lang',state.lang);state.form.type='';render()}
  else if(a==='theme'){var n=currentTheme()==='dark'?'light':'dark';root.setAttribute('data-theme',n);setPref('pf-theme',n);render()}
  else if(a==='all'){state.showAll=!state.showAll;render()}
  else if(a==='pause'){state.paused=!state.paused;render()}
  else if(a==='filter'){state.filter=v;render()}
  else if(a==='copy-msg')copy(message(),document.getElementById('msg'));
  else if(a==='copy-mail')copy(state.data.profile.email.trim(),document.getElementById('mail-text'));
  else if(a==='edit-msg'){state.ticket=false;render()}
  else if(a==='like'){var r=route();if(r.item){var idx={identity:0,packaging:1,social:2,print:3}[r.item.category],s=state.data.services[idx];state.form.type=s?tx(s.title):''}state.ticket=false;location.hash='contact'}
  else if(a==='tab'){state.tab=v;render()}
  else if(a==='add'){var item=BLANK[ln]();state.data[ln].push(item);if(item.id)state.open[item.id]=true;changed();render()}
  else if(a==='move'){var arr=state.data[ln],j=i+Number(el.getAttribute('data-dir'));if(j>=0&&j<arr.length){var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;changed();render()}}
  else if(a==='del'){var key=ln+':'+i;if(state.confirm===key){state.data[ln].splice(i,1);state.confirm=null;changed()}else state.confirm=key;render()}
  else if(a==='remove-img'){var tg=resolve(el.getAttribute('data-path'));if(el.getAttribute('data-i')!=='')tg.o[tg.key].splice(i,1);else tg.o[tg.key]='';changed();render()}
  else if(a==='discard'){if(state.confirm==='discard'){state.data=clone(SAVED);state.confirm=null;changed()}else state.confirm='discard';render()}
  else if(a==='save')save();
  else if(a==='restore'){state.data=state.pendingDraft;state.pendingDraft=null;changed();render()}
  else if(a==='drop-draft'){state.pendingDraft=null;setPref(DRAFT_KEY,null);render()}
  else if(a==='backup')copy(JSON.stringify(state.data),document.getElementById('s-backup'));
  else if(a==='import'){try{state.data=normalize(JSON.parse(document.getElementById('s-backup').value));changed();render();toast(t('imported'))}catch(err){toast(t('importBad'))}}
});
function onField(e){
  var el=e.target,f=el.getAttribute('data-form'),path=el.getAttribute('data-path');
  if(f)state.form[f]=el.value;
  else if(path&&el.tagName!=='BUTTON'){var tg=resolve(path);tg.o[tg.key]=el.type==='checkbox'?el.checked:el.value;changed()}
}
app.addEventListener('input',onField);
app.addEventListener('change',function(e){if(e.target.hasAttribute('data-upload'))upload(e.target);else onField(e)});
app.addEventListener('toggle',function(e){var id=e.target.getAttribute&&e.target.getAttribute('data-open');if(id)state.open[id]=e.target.open},true);
app.addEventListener('submit',function(e){
  e.preventDefault();
  var f=state.form;
  state.formError=!(f.name.trim()&&f.contact.trim()&&f.details.trim());
  state.ticket=!state.formError;
  render();
});

var theme=getPref('pf-theme');
if(theme==='dark'||theme==='light')root.setAttribute('data-theme',theme);
render();
if(location.hash)scrollToRoute();

if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('user'),window.claude.use('artifact'),window.claude.use('assets')]).then(function(c){
    state.artifact=c[1];state.assets=c[2];
    return c[0]?c[0].canEdit():false;
  }).then(function(can){
    state.canEdit=!!can;
    if(state.canEdit){render();if(location.hash)scrollToRoute()}
  });
}
})();
</script>

</body></html>
